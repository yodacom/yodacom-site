<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;">
  <defs>
    <linearGradient id="me-bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="60%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <radialGradient id="me-tealGlow" cx="20%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="me-blueGlow" cx="80%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="me-orangeGlow" cx="50%" cy="85%" r="30%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="me-gridLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00d4aa" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#00d4aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="me-gridFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00d4aa" stop-opacity="1"/>
      <stop offset="85%" stop-color="#00d4aa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="me-chartClip">
      <rect x="0" y="0" width="1200" height="630"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#me-bgGrad)"/>
  <rect width="1200" height="630" fill="url(#me-tealGlow)"/>
  <rect width="1200" height="630" fill="url(#me-blueGlow)"/>
  <rect width="1200" height="630" fill="url(#me-orangeGlow)"/>

  <!-- Grid level lines spanning full width -->
  <g opacity="0.14" clip-path="url(#me-chartClip)">
    <line x1="80" y1="290" x2="1120" y2="290" stroke="url(#me-gridFade)" stroke-width="0.6"/>
    <line x1="80" y1="315" x2="1120" y2="315" stroke="url(#me-gridFade)" stroke-width="0.6"/>
    <line x1="80" y1="340" x2="1120" y2="340" stroke="url(#me-gridFade)" stroke-width="0.7"/>
    <line x1="80" y1="365" x2="1120" y2="365" stroke="url(#me-gridFade)" stroke-width="1.0"/>
    <line x1="80" y1="390" x2="1120" y2="390" stroke="url(#me-gridFade)" stroke-width="0.7"/>
    <line x1="80" y1="415" x2="1120" y2="415" stroke="url(#me-gridFade)" stroke-width="0.6"/>
    <line x1="80" y1="440" x2="1120" y2="440" stroke="url(#me-gridFade)" stroke-width="0.6"/>
    <line x1="80" y1="465" x2="1120" y2="465" stroke="url(#me-gridFade)" stroke-width="0.6"/>
  </g>

  <!-- Price path oscillating through grid — full width, gently trending upward -->
  <polyline points="80,460 140,435 200,415 260,440 320,410 380,385 440,405 500,375 560,395 620,365 680,385 740,355 800,375 860,345 920,365 980,335 1040,355 1100,325 1140,340"
    fill="none" stroke="#00d4aa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.75"/>
  <g fill="#00d4aa" opacity="0.85">
    <circle cx="140" cy="435" r="3.5"/>
    <circle cx="260" cy="440" r="3.5"/>
    <circle cx="380" cy="385" r="3.5"/>
    <circle cx="500" cy="375" r="3.5"/>
    <circle cx="620" cy="365" r="3.5"/>
    <circle cx="740" cy="355" r="3.5"/>
    <circle cx="860" cy="345" r="3.5"/>
    <circle cx="980" cy="335" r="3.5"/>
    <circle cx="1100" cy="325" r="3.5"/>
  </g>

  <!-- Top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00d4aa" stroke-width="2" opacity="0.3"/>
  <!-- Bottom accent line -->
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#3B82F6" stroke-width="2" opacity="0.2"/>

  <!-- Title block — centered vertically in upper half, left-anchored -->
  <text x="80" y="100" font-family="'Inter','Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#3B82F6" letter-spacing="0.14em">YODACOM RESEARCH&#xA0;&#xB7;&#xA0; MODERN-ERA STUDY</text>
  <text x="80" y="162" font-family="'Georgia','Times New Roman',serif" font-size="46" font-weight="700" fill="#F0F4FC">Grid Trading in the</text>
  <text x="80" y="218" font-family="'Georgia','Times New Roman',serif" font-size="46" font-weight="700" fill="#F0F4FC">Modern Crypto Era</text>
  <text x="80" y="262" font-family="'Georgia','Times New Roman',serif" font-size="34" fill="#00d4aa">2019&#x2013;2025</text>

  <!-- Divider rule -->
  <line x1="80" y1="284" x2="720" y2="284" stroke="url(#me-gridLineGrad)" stroke-width="1"/>

  <!-- Subtitle / methodology descriptor -->
  <text x="80" y="513" font-family="'Inter','Segoe UI',sans-serif" font-size="14" fill="#7A90B0">Walk-Forward Validation of RXI v2 Gated Grid Strategy</text>
  <text x="80" y="533" font-family="'Inter','Segoe UI',sans-serif" font-size="13" fill="#5A7090">17 Assets&#xA0;&#xB7;&#xA0; 85 Folds&#xA0;&#xB7;&#xA0; 2-Year Train / 1-Year Test</text>

  <!-- Byline -->
  <text x="80" y="580" font-family="'Inter','Segoe UI',sans-serif" font-size="11" fill="#2A4060">Han Kessel &#x2014; Yodacom Research&#xA0;&#xB7;&#xA0; 2026-05-27</text>

  <!-- CoinRoc wordmark -->
  <text x="1120" y="565" font-family="'Inter','Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F" text-anchor="end" letter-spacing="0.06em">CoinRoc</text>
  <text x="1120" y="580" font-family="'Inter','Segoe UI',sans-serif" font-size="10" fill="#0E2040" text-anchor="end" letter-spacing="0.06em">CRYPTO GRID ANALYSIS</text>
</svg>
